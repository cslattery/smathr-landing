name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write   # Needed to comment on PRs

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github"
          service_account: "${{ vars.GCP_GITHUB_ACTIONS_SA }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="image=europe-west1-docker.pkg.dev/smathr-dev/smathr-images/smathr-landing:pr-${{ github.event.pull_request.number }}" \
            -out=tfplan

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('terraform/tfplan') 
              ? 'Terraform plan completed. See job logs for details.' 
              : 'Terraform plan step failed or was skipped.';

            const output = `### Terraform Plan Result

            \`\`\`hcl
            ${plan}
            \`\`\`

            **Note:** Full plan output (including resource changes) is available in the GitHub Actions logs.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });